version: 2.1

executors:
  docker-publisher:
    environment:
      IMAGE_NAME: sharinpix/docker-android
    docker:
      - image: cimg/base:current
        # Authenticated pull: avoids Docker Hub's anonymous pull rate limit.
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASS

jobs:
  # Build, test and push in a single job: no `docker save` / workspace / `docker load`
  # round trip of a multi-GB tarball between jobs.
  build-and-publish:
    executor: docker-publisher
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Log in to Docker Hub
          command: echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build Docker image
          command: docker build --pull -t "$IMAGE_NAME:ci" .
      - run:
          name: Smoke test
          command: |
            docker run --rm "$IMAGE_NAME:ci" bash -c '
              set -ex
              test "$(id -u):$(id -g)" = "1000:1000"
              test -w "$ANDROID_HOME"
              java -version
              gradle -v
              node -v
              ruby -v
              cordova -v < /dev/null
              ionic -v
              sdkmanager --list_installed
            '
      - run:
          name: Tag and push
          command: |
            TAGS="sha-${CIRCLE_SHA1:0:7}"
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              TAGS="$TAGS latest"
            else
              TAGS="$TAGS circle-${CIRCLE_BUILD_NUM}"
              if [ -n "$CIRCLE_PULL_REQUEST" ]; then
                TAGS="$TAGS pr-${CIRCLE_PULL_REQUEST##*/}"
              fi
            fi
            for TAG in $TAGS; do
              docker tag "$IMAGE_NAME:ci" "$IMAGE_NAME:$TAG"
              docker push "$IMAGE_NAME:$TAG"
            done

workflows:
  build-and-publish:
    jobs:
      - build-and-publish
